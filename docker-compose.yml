services:
  api:
    build:
      context: ./apps/api
    container_name: ai-placement-api
    ports:
      - "5000:5000"
    env_file:
      - ./apps/api/.env
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: "http://localhost:5000/api"
    container_name: ai-placement-web
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy